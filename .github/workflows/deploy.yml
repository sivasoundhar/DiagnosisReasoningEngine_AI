name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest -v
        env:
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: "test"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t diagnosis-ai:ci .

      - name: Smoke test the built image
        run: |
          docker run -d --name diagnosis-ai-ci -p 8000:8000 diagnosis-ai:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed" >&2
          docker logs diagnosis-ai-ci
          exit 1

  # Deploy is intentionally a no-op until Render is set up (see
  # docs/DEPLOYMENT_NOTES.md) - gated on a secret that doesn't exist yet
  # rather than failing every run in the meantime. Once a Render web service
  # exists, add its Deploy Hook URL as the RENDER_DEPLOY_HOOK_URL repo
  # secret and this job starts firing on every push to main automatically.
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set - skipping deploy (Render isn't configured yet)."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
