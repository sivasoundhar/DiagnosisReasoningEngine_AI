[project]
name = "diagnosis-reasoning-engine"
version = "0.1.0"
description = "Multi-agent clinical decision support system built with LangGraph, FastAPI, and React."
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
